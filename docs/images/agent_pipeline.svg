<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 1630 1004" width="1630" height="1004" font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#1f2328" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a3f47"/></marker></defs><rect x="-40" y="0" width="1630" height="1004" fill="#FFFFFF"/><text x="0" y="40" font-size="40" font-weight="bold">Grounded lung CT agent</text><text x="0" y="90" font-size="24">Measure, classify, look, cross-check, then report with evidence.</text><rect x="-24" y="180" width="1594" height="426" rx="18" fill="#F4F5F7" stroke="#C9CDD3" stroke-width="1.2"/><text x="-18" y="170" font-size="18" font-weight="bold">Agent pipeline (fixed order to start)</text><rect x="0" y="348" width="120" height="90" rx="45" fill="#FFFFFF" stroke="#3a3f47" stroke-width="1.3"/><text x="60.0" y="398.2" font-size="15" font-weight="bold" text-anchor="middle">3D chest CT</text><rect x="184" y="338" width="170" height="110" rx="14" fill="#DCE8FB" stroke="#3a3f47" stroke-width="1.3"/><text x="269.0" y="367.9" font-size="15" font-weight="bold" text-anchor="middle">Step 0 · Check scan</text><text x="269.0" y="388.1" font-size="15" font-weight="normal" text-anchor="middle">HU, orientation,</text><text x="269.0" y="408.4" font-size="15" font-weight="normal" text-anchor="middle">coverage</text><text x="269.0" y="428.6" font-size="15" font-weight="normal" font-style="italic" text-anchor="middle">done</text><rect x="418" y="204" width="300" height="110" rx="14" fill="#DCE8FB" stroke="#3a3f47" stroke-width="1.3"/><text x="568.0" y="244.0" font-size="15" font-weight="bold" text-anchor="middle">Step 1 · Measure (where / how much)</text><text x="568.0" y="264.2" font-size="15" font-weight="normal" text-anchor="middle">TotalSegmentator, airway tree</text><text x="568.0" y="284.5" font-size="15" font-weight="normal" text-anchor="middle">+ opacity segmenter (new)</text><rect x="418" y="338" width="300" height="110" rx="14" fill="#DCE8FB" stroke="#3a3f47" stroke-width="1.3"/><text x="568.0" y="378.0" font-size="15" font-weight="bold" text-anchor="middle">Step 2 · Classify (what)</text><text x="568.0" y="398.2" font-size="15" font-weight="normal" text-anchor="middle">COLIPRI / EXACT: 18 findings</text><text x="568.0" y="418.5" font-size="15" font-weight="normal" text-anchor="middle">EXACT maps × lobe masks (new)</text><rect x="418" y="472" width="300" height="110" rx="14" fill="#DCE8FB" stroke="#3a3f47" stroke-width="1.3"/><text x="568.0" y="512.0" font-size="15" font-weight="bold" text-anchor="middle">Step 3 · Look (describe)</text><text x="568.0" y="532.2" font-size="15" font-weight="normal" text-anchor="middle">MedGemma, Hulu-Med (tested)</text><text x="568.0" y="552.5" font-size="15" font-weight="normal" text-anchor="middle">NV-Reason-CT (to try)</text><path d="M782,345 v96 a100.0,12 0 0 0 200,0 v-96 a100.0,12 0 0 0 -200,0 z" fill="#FBF0C2" stroke="#3a3f47" stroke-width="1.3"/><ellipse cx="882.0" cy="345" rx="100.0" ry="12" fill="#FBF0C2" stroke="#3a3f47" stroke-width="1.3"/><text x="882.0" y="384.0" font-size="15" font-weight="bold" text-anchor="middle">Evidence table</text><text x="882.0" y="404.2" font-size="15" font-weight="normal" text-anchor="middle">every row tagged with</text><text x="882.0" y="424.5" font-size="15" font-weight="normal" text-anchor="middle">how reliable it is</text><rect x="1046" y="333" width="210" height="120" rx="14" fill="#DCE8FB" stroke="#3a3f47" stroke-width="1.3"/><text x="1151.0" y="369.5" font-size="14" font-weight="bold" text-anchor="middle">Step 4 · Cross-check</text><text x="1151.0" y="388.4" font-size="14" font-weight="normal" text-anchor="middle">flag conflicts</text><text x="1151.0" y="407.3" font-size="14" font-weight="normal" text-anchor="middle">WHERE: trust measurements</text><text x="1151.0" y="426.2" font-size="14" font-weight="normal" text-anchor="middle">WHAT: classifier + reader</text><rect x="1320" y="333" width="210" height="120" rx="14" fill="#DCE8FB" stroke="#3a3f47" stroke-width="1.3"/><text x="1425.0" y="369.5" font-size="14" font-weight="bold" text-anchor="middle">Step 5 · Final report</text><text x="1425.0" y="388.4" font-size="14" font-weight="normal" text-anchor="middle">every claim cites a row</text><text x="1425.0" y="407.3" font-size="14" font-weight="normal" text-anchor="middle">conflicts listed</text><text x="1425.0" y="426.2" font-size="14" font-weight="normal" text-anchor="middle">&#x27;cannot tell&#x27; allowed</text><rect x="1320" y="517" width="210" height="65" rx="14" fill="#D6F0DA" stroke="#3a3f47" stroke-width="1.3"/><text x="1425.0" y="554.4" font-size="14" font-weight="bold" text-anchor="middle">One-page clinician review</text><path d="M120,393 L184,393" fill="none" stroke="#3a3f47" stroke-width="1.6" marker-end="url(#ah)"/><path d="M354,393 L386,393 L386,259 L418,259" fill="none" stroke="#3a3f47" stroke-width="1.6" marker-end="url(#ah)"/><path d="M354,393 L386,393 L386,393 L418,393" fill="none" stroke="#3a3f47" stroke-width="1.6" marker-end="url(#ah)"/><path d="M354,393 L386,393 L386,527 L418,527" fill="none" stroke="#3a3f47" stroke-width="1.6" marker-end="url(#ah)"/><path d="M718,259 L750,259 L750,393 L782,393" fill="none" stroke="#3a3f47" stroke-width="1.6" marker-end="url(#ah)"/><path d="M718,393 L750,393 L750,393 L782,393" fill="none" stroke="#3a3f47" stroke-width="1.6" marker-end="url(#ah)"/><path d="M718,527 L750,527 L750,393 L782,393" fill="none" stroke="#3a3f47" stroke-width="1.6" marker-end="url(#ah)"/><path d="M982,393 L1046,393" fill="none" stroke="#3a3f47" stroke-width="1.6" marker-end="url(#ah)"/><path d="M1256,393 L1320,393" fill="none" stroke="#3a3f47" stroke-width="1.6" marker-end="url(#ah)"/><path d="M1425,453 L1425,517" fill="none" stroke="#3a3f47" stroke-width="1.6" marker-end="url(#ah)"/><path d="M1320,549 L1151,549 L1151,453" fill="none" stroke="#3a3f47" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#ah)"/><text x="1236" y="541" font-size="14" font-style="italic" text-anchor="middle">feedback</text><rect x="-24" y="700" width="1594" height="218" rx="18" fill="#F4F5F7" stroke="#C9CDD3" stroke-width="1.2"/><text x="-18" y="690" font-size="18" font-weight="bold">What could be new, if we build and measure it</text><rect x="0" y="724" width="290" height="170" rx="14" fill="#FBDCC6" stroke="#3a3f47" stroke-width="1.3"/><text x="14" y="783.9" font-size="15" font-weight="bold" text-anchor="start">1 · Measure WHERE, not just WHAT</text><text x="14" y="804.1" font-size="15" font-weight="normal" text-anchor="start">Score side, zone, outer vs central</text><text x="14" y="824.4" font-size="15" font-weight="normal" text-anchor="start">against expert masks. No published</text><text x="14" y="844.6" font-size="15" font-weight="normal" text-anchor="start">CT model reports this.</text><rect x="314" y="724" width="290" height="170" rx="14" fill="#FBDCC6" stroke="#3a3f47" stroke-width="1.3"/><text x="328" y="783.9" font-size="15" font-weight="bold" text-anchor="start">2 · Reliability-tagged evidence</text><text x="328" y="804.1" font-size="15" font-weight="normal" text-anchor="start">Each number carries a trust label</text><text x="328" y="824.4" font-size="15" font-weight="normal" text-anchor="start">the agent must weigh. Published</text><text x="328" y="844.6" font-size="15" font-weight="normal" text-anchor="start">agents treat tool output as true.</text><rect x="628" y="724" width="290" height="170" rx="14" fill="#FBDCC6" stroke="#3a3f47" stroke-width="1.3"/><text x="642" y="783.9" font-size="15" font-weight="bold" text-anchor="start">3 · Cross-check 3 model types</text><text x="642" y="804.1" font-size="15" font-weight="normal" text-anchor="start">Segmentation vs classifier vs reader;</text><text x="642" y="824.4" font-size="15" font-weight="normal" text-anchor="start">conflicts go to the doctor. Measure</text><text x="642" y="844.6" font-size="15" font-weight="normal" text-anchor="start">% of reader errors caught.</text><rect x="942" y="724" width="290" height="170" rx="14" fill="#FFFFFF" stroke="#3a3f47" stroke-width="1.3"/><text x="956" y="783.9" font-size="15" font-weight="bold" text-anchor="start">4 · Airway-tree evidence</text><text x="956" y="804.1" font-size="15" font-weight="normal" text-anchor="start">Branching, later airway-to-artery</text><text x="956" y="824.4" font-size="15" font-weight="normal" text-anchor="start">size, for bronchiectasis (the grant</text><text x="956" y="844.6" font-size="15" font-weight="normal" text-anchor="start">topic). Needs validation first.</text><rect x="1256" y="724" width="290" height="170" rx="14" fill="#FFFFFF" stroke="#3a3f47" stroke-width="1.3"/><text x="1270" y="783.9" font-size="15" font-weight="bold" text-anchor="start">5 · Fully local + doctor feedback</text><text x="1270" y="804.1" font-size="15" font-weight="normal" text-anchor="start">One 24 GB GPU, open models,</text><text x="1270" y="824.4" font-size="15" font-weight="normal" text-anchor="start">no scan leaves the machine.</text><text x="1270" y="844.6" font-size="15" font-weight="normal" text-anchor="start">Practical angle.</text><text x="0" y="960" font-size="15">Peach = strongest claims (they produce numbers). Not new on its own: "tools + language model report" (MedScribe, 3DMedAgent, RadAgent).</text><text x="0" y="984" font-size="15">Check claims 1–3 in the literature before calling them novel. Details: PAPER_NOVELTY.md</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>