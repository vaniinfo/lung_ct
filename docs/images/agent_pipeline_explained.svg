<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 1580 1062" width="1580" height="1062" font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#1f2328" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a3f47"/></marker></defs><rect x="-10" y="0" width="1580" height="1062" fill="#FFFFFF"/><text x="0" y="40" font-size="34" font-weight="bold">How the lung CT agent works, step by step</text><text x="0" y="78" font-size="19">Running example: coronacases_006, a COVID scan where most of the disease is in the right lung.</text><text x="12" y="112" font-size="16" font-weight="bold" fill="#57606a">Step</text><text x="312" y="112" font-size="16" font-weight="bold" fill="#57606a">What it does (in plain words)</text><text x="882" y="112" font-size="16" font-weight="bold" fill="#57606a">Example: coronacases_006</text><rect x="0" y="126" width="1560" height="102" rx="12" fill="#F4F5F7" stroke="#C9CDD3"/><rect x="8" y="134" width="276" height="86" rx="10" fill="#DCE8FB" stroke="#3a3f47" stroke-width="1.2"/><text x="24" y="168" font-size="15" fill="#57606a">Step 0</text><text x="24" y="192" font-size="18" font-weight="bold">Check the scan</text><text x="312" y="154" font-size="16">Make sure the CT file is usable: real density</text><text x="312" y="174" font-size="16">numbers (HU), right orientation, whole chest</text><text x="312" y="194" font-size="16">included. Like checking a photo isn&#x27;t blurry</text><text x="312" y="214" font-size="16">before you study it.</text><rect x="870" y="134" width="682" height="86" rx="10" fill="#FFFFFF" stroke="#D5D9DE"/><text x="884" y="160" font-size="16" font-style="italic">Scan density runs from -1023 to 2217 HU,</text><text x="884" y="181" font-size="16" font-style="italic">so the numbers are real. OK to continue.</text><path d="M142.0,220 L142.0,246" stroke="#3a3f47" stroke-width="1.6" marker-end="url(#ah)"/><rect x="0" y="238" width="1560" height="102" rx="12" fill="#F4F5F7" stroke="#C9CDD3"/><rect x="8" y="246" width="276" height="86" rx="10" fill="#DCE8FB" stroke="#3a3f47" stroke-width="1.2"/><text x="24" y="280" font-size="15" fill="#57606a">Step 1 · where &amp; how much</text><text x="24" y="304" font-size="18" font-weight="bold">Measure</text><text x="312" y="266" font-size="16">Computer tools outline the lungs, lobes and</text><text x="312" y="286" font-size="16">airways, then measure. Diseased lung looks</text><text x="312" y="306" font-size="16">denser (whiter), so we count how much dense</text><text x="312" y="326" font-size="16">tissue there is and where it sits.</text><rect x="870" y="246" width="682" height="86" rx="10" fill="#FFFFFF" stroke="#D5D9DE"/><text x="884" y="272" font-size="16" font-style="italic">Dense tissue: 102 mL. Left lung 7 mL,</text><text x="884" y="293" font-size="16" font-style="italic">right lung 95 mL, so 93% is on the right.</text><text x="884" y="314" font-size="16" font-style="italic">81% of it is in the lower zone.</text><path d="M142.0,332 L142.0,358" stroke="#3a3f47" stroke-width="1.6" marker-end="url(#ah)"/><rect x="0" y="350" width="1560" height="102" rx="12" fill="#F4F5F7" stroke="#C9CDD3"/><rect x="8" y="358" width="276" height="86" rx="10" fill="#DCE8FB" stroke="#3a3f47" stroke-width="1.2"/><text x="24" y="392" font-size="15" fill="#57606a">Step 2 · what</text><text x="24" y="416" font-size="18" font-weight="bold">Classify</text><text x="312" y="378" font-size="16">A second AI model gives a score from 0 to 1</text><text x="312" y="398" font-size="16">for 19 possible findings (e.g. consolidation,</text><text x="312" y="418" font-size="16">effusion, emphysema). Like a checklist with</text><text x="312" y="438" font-size="16">a confidence number next to each item.</text><rect x="870" y="358" width="682" height="86" rx="10" fill="#FFFFFF" stroke="#D5D9DE"/><text x="884" y="384" font-size="16" font-style="italic">Example format: &#x27;Lung opacity 0.9,</text><text x="884" y="405" font-size="16" font-style="italic">Pleural effusion 0.1&#x27;. Scores are rough</text><text x="884" y="426" font-size="16" font-style="italic">(not calibrated), so they only raise flags.</text><path d="M142.0,444 L142.0,470" stroke="#3a3f47" stroke-width="1.6" marker-end="url(#ah)"/><rect x="0" y="462" width="1560" height="102" rx="12" fill="#F4F5F7" stroke="#C9CDD3"/><rect x="8" y="470" width="276" height="86" rx="10" fill="#DCE8FB" stroke="#3a3f47" stroke-width="1.2"/><text x="24" y="504" font-size="15" fill="#57606a">Step 3 · describe</text><text x="24" y="528" font-size="18" font-weight="bold">Look</text><text x="312" y="490" font-size="16">Vision-language AIs (MedGemma, Hulu-Med)</text><text x="312" y="510" font-size="16">look at the CT pictures and describe what</text><text x="312" y="530" font-size="16">they see in words, like a student writing</text><text x="312" y="550" font-size="16">what they notice, with no measurements.</text><rect x="870" y="470" width="682" height="86" rx="10" fill="#FFFFFF" stroke="#D5D9DE"/><text x="884" y="496" font-size="16" font-style="italic">MedGemma: &#x27;opacities in both lungs, lower,</text><text x="884" y="517" font-size="16" font-style="italic">outer edge.&#x27;  Hulu-Med: &#x27;no opacities</text><text x="884" y="538" font-size="16" font-style="italic">visible.&#x27;</text><path d="M142.0,556 L142.0,582" stroke="#3a3f47" stroke-width="1.6" marker-end="url(#ah)"/><rect x="0" y="574" width="1560" height="102" rx="12" fill="#F4F5F7" stroke="#C9CDD3"/><rect x="8" y="582" width="276" height="86" rx="10" fill="#FBF0C2" stroke="#3a3f47" stroke-width="1.2"/><text x="24" y="616" font-size="15" fill="#57606a">After steps 1-3</text><text x="24" y="640" font-size="18" font-weight="bold">Evidence table</text><text x="312" y="602" font-size="16">Every number from steps 1-2 goes into one</text><text x="312" y="622" font-size="16">table. Each row gets an ID (like E13) and a</text><text x="312" y="642" font-size="16">trust label: how reliable that measurement</text><text x="312" y="662" font-size="16">has proven to be.</text><rect x="870" y="582" width="682" height="86" rx="10" fill="#FFFFFF" stroke="#D5D9DE"/><text x="884" y="608" font-size="16" font-style="italic">E13 = 93% of dense tissue in right lung</text><text x="884" y="629" font-size="16" font-style="italic">(trust: moderate - matched the expert</text><text x="884" y="650" font-size="16" font-style="italic">answer for zone in 8 of 10 test cases).</text><path d="M142.0,668 L142.0,694" stroke="#3a3f47" stroke-width="1.6" marker-end="url(#ah)"/><rect x="0" y="686" width="1560" height="102" rx="12" fill="#F4F5F7" stroke="#C9CDD3"/><rect x="8" y="694" width="276" height="86" rx="10" fill="#DCE8FB" stroke="#3a3f47" stroke-width="1.2"/><text x="24" y="728" font-size="15" fill="#57606a">Step 4 · the referee</text><text x="24" y="752" font-size="18" font-weight="bold">Cross-check</text><text x="312" y="714" font-size="16">Compare the AIs&#x27; words with the</text><text x="312" y="734" font-size="16">measurements. Where they disagree, flag it.</text><text x="312" y="754" font-size="16">Rule: for WHERE, trust the measurements;</text><text x="312" y="774" font-size="16">for WHAT, weigh the AIs and classifier.</text><rect x="870" y="694" width="682" height="86" rx="10" fill="#FFFFFF" stroke="#D5D9DE"/><text x="884" y="720" font-size="16" font-style="italic">Flag: MedGemma said &#x27;both sides&#x27; but 93%</text><text x="884" y="741" font-size="16" font-style="italic">is on the right.  Flag: Hulu-Med said &#x27;no</text><text x="884" y="762" font-size="16" font-style="italic">opacities&#x27; but 102 mL of dense tissue found.</text><path d="M142.0,780 L142.0,806" stroke="#3a3f47" stroke-width="1.6" marker-end="url(#ah)"/><rect x="0" y="798" width="1560" height="102" rx="12" fill="#F4F5F7" stroke="#C9CDD3"/><rect x="8" y="806" width="276" height="86" rx="10" fill="#DCE8FB" stroke="#3a3f47" stroke-width="1.2"/><text x="24" y="840" font-size="15" fill="#57606a">Step 5</text><text x="24" y="864" font-size="18" font-weight="bold">Final report</text><text x="312" y="826" font-size="16">A language model writes the summary. Every</text><text x="312" y="846" font-size="16">sentence must cite an evidence ID, and a</text><text x="312" y="866" font-size="16">checker makes sure each number really</text><text x="312" y="886" font-size="16">appears in the row it cites.</text><rect x="870" y="806" width="682" height="86" rx="10" fill="#FFFFFF" stroke="#D5D9DE"/><text x="884" y="832" font-size="16" font-style="italic">&#x27;Opacities in both lungs, mostly right (93%,</text><text x="884" y="853" font-size="16" font-style="italic">E13), lower zone (E14). Please check: the</text><text x="884" y="874" font-size="16" font-style="italic">two AI readers disagreed with the measurements.&#x27;</text><path d="M142.0,892 L142.0,918" stroke="#3a3f47" stroke-width="1.6" marker-end="url(#ah)"/><rect x="0" y="910" width="1560" height="102" rx="12" fill="#F4F5F7" stroke="#C9CDD3"/><rect x="8" y="918" width="276" height="86" rx="10" fill="#D6F0DA" stroke="#3a3f47" stroke-width="1.2"/><text x="24" y="952" font-size="15" fill="#57606a">Last</text><text x="24" y="976" font-size="18" font-weight="bold">Doctor checks it</text><text x="312" y="938" font-size="16">A one-page sheet shows the pictures,</text><text x="312" y="958" font-size="16">numbers, AI answers, flags and report.</text><text x="312" y="978" font-size="16">The doctor marks what is right or wrong,</text><text x="312" y="998" font-size="16">and that feedback improves the steps.</text><rect x="870" y="918" width="682" height="86" rx="10" fill="#FFFFFF" stroke="#D5D9DE"/><text x="884" y="944" font-size="16" font-style="italic">The reviewer sees the 2 flags first and</text><text x="884" y="965" font-size="16" font-style="italic">decides whether the measurements or the</text><text x="884" y="986" font-size="16" font-style="italic">AI readers were right.</text><text x="0" y="1044" font-size="15" fill="#57606a">Steps 1, 2 and 3 run side by side on the same scan; their outputs all feed the evidence table. Research use only - not a clinical report.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>