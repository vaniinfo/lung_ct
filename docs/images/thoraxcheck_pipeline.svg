<text x="60" y="64" font-size="32" font-weight="700" fill="#17375e">ThoraxCheck: from scan to clinician review</text>
<text x="60" y="96" font-size="17" fill="#5b6b82">Evidence-based framework for chest CT assessment · simplified pipeline · checklist v3_12 · viewer v7</text>
<text x="60" y="150" font-size="14" font-weight="700" letter-spacing="2" fill="#5b6b82">01 INPUT</text>
<text x="420" y="150" font-size="14" font-weight="700" letter-spacing="2" fill="#5b6b82">02 EVIDENCE</text>
<text x="830" y="150" font-size="14" font-weight="700" letter-spacing="2" fill="#5b6b82">03 DECISION</text>
<text x="1180" y="150" font-size="14" font-weight="700" letter-spacing="2" fill="#5b6b82">04 REVIEW</text>
