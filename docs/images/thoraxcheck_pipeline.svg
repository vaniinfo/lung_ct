<text x="850" y="291" font-size="15" font-weight="400" fill="#ffffff">Combine the evidence</text>
<text x="850" y="313" font-size="15" font-weight="400" fill="#ffffff">Apply quality gates</text>
<text x="850" y="335" font-size="15" font-weight="400" fill="#ffffff">Answer + its basis</text>
<text x="850" y="357" font-size="15" font-weight="400" fill="#ffffff">&quot;Cannot tell&quot; when unresolved</text>
