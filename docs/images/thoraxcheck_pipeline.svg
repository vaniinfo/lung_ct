<text x="80" y="297" font-size="15" font-weight="700" fill="#1f2328">Orientation from anatomy</text>
<text x="80" y="319" font-size="15" font-weight="400" fill="#1f2328">Heart left, liver right</text>
<text x="80" y="341" font-size="15" font-weight="400" fill="#1f2328">Heart in front, trachea above</text>
<text x="80" y="363" font-size="15" font-weight="700" fill="#1f2328">Only verified scans go on</text>
<text x="80" y="385" font-size="15" font-weight="400" fill="#1f2328">Failures are listed</text>
